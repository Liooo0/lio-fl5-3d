<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Honda Civic Type R FL5 · 3D 剖视</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#dfe7ee;
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  canvas{display:block}
  #ui{position:fixed;inset:0;pointer-events:none;color:#e8ecf0;z-index:10}
  .card{background:rgba(13,16,20,.74);border:1px solid rgba(255,255,255,.08);
    border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto}
  #title{position:absolute;left:16px;top:16px;padding:12px 18px}
  #title h1{margin:0;font-size:17px;letter-spacing:.5px;font-weight:700}
  #title .sub{margin-top:3px;font-size:11.5px;color:#ff4b3e;font-weight:600;letter-spacing:2px}
  #title .sub2{font-size:11px;color:#9fb0bd;margin-top:2px}
  #panel{position:absolute;right:16px;top:16px;width:228px;padding:14px 16px}
  #panel .row{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:12.5px;color:#cfd8df}
  #panel label{width:62px;flex:none}
  #panel input[type=range]{flex:1;accent-color:#e10600}
  #panel button{width:100%;margin-top:6px;padding:8px 0;border:none;border-radius:8px;
    background:#e10600;color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;letter-spacing:1px}
  #panel button.ghost{background:rgba(255,255,255,.10)}
  #panel button:hover{filter:brightness(1.15)}
  #hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    padding:7px 18px;font-size:12px;color:#b9c6d0;white-space:nowrap}
  #hint b{color:#fff;font-weight:600}
  #station{position:absolute;left:50%;top:56px;transform:translateX(-50%);
    padding:10px 26px;font-size:19px;font-weight:700;letter-spacing:2px;color:#fff;
    opacity:0;transition:opacity .5s}
  #station.on{opacity:1}
  #tip{position:absolute;padding:6px 12px;font-size:13px;font-weight:600;background:
    rgba(225,6,0,.92);border-radius:7px;pointer-events:none;display:none;z-index:20;
    box-shadow:0 4px 14px rgba(0,0,0,.35)}
  #tip:before{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:rgba(225,6,0,.92);border-bottom:none}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#11151a;color:#cfd8df;z-index:99;flex-direction:column;gap:14px}
  #loader .spin{width:38px;height:38px;border:3px solid rgba(255,255,255,.15);
    border-top-color:#e10600;border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loader .t1{font-size:15px;font-weight:600;color:#fff}
  #loader .t2{font-size:11.5px;color:#8a97a3}
  #errbox{max-width:520px;font-size:11px;color:#ff9a93;white-space:pre-wrap;display:none}
</style>
<script>
  window.__fl5 = { phase:'boot', ready:false, errs:[], parts:[], stats:{tris:0,fps:0} };
  window.addEventListener('error', function(e){
    try{ window.__fl5.errs.push('window.onerror: '+(e.message||e.type)+' @'+(e.filename||'')+':'+(e.lineno||0)); }catch(_){}
  });
  window.addEventListener('unhandledrejection', function(e){
    try{ window.__fl5.errs.push('unhandledrejection: '+e.reason); }catch(_){}
  });
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loader">
  <div class="spin"></div>
  <div class="t1">正在加载 Honda Civic Type R FL5 · 3D 剖视模型…</div>
  <div class="t2">Three.js 由 CDN 加载,若长时间停留请检查网络(需可访问 unpkg.com)</div>
  <div id="errbox"></div>
</div>
<div id="ui">
  <div id="title" class="card">
    <h1>Honda Civic Type R FL5 · 3D 剖视</h1>
    <div class="sub">TYPE R · K20C1 · 6MT · FRONT WHEEL DRIVE</div>
    <div class="sub2">点击零件查看名称 | 拖动滑块透视 / 爆炸</div>
  </div>
  <div id="panel" class="card">
    <button id="btnTour">▶ 运镜模式</button>
    <div class="row"><label>X光车壳</label><input id="xr" type="range" min="0" max="100" value="0"></div>
    <div class="row"><label>爆炸视图</label><input id="ex" type="range" min="0" max="100" value="0"></div>
    <button id="btnReset" class="ghost">复位视角</button>
  </div>
  <div id="station" class="card"></div>
  <div id="hint"><b>左键拖拽</b> 旋转 · <b>滚轮</b> 推进镜头 · <b>右键拖拽</b> 平移 · <b>点击零件</b> 显示名称</div>
  <div id="tip"></div>
</div>
<script type="module" src="app.js?v=11"></script>
</body>
</html>
